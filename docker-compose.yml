services:
  nats:
    image: nats:latest
    container_name: nats-server
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  worker:
    build: .
    restart: unless-stopped
    environment:
      - NATS_URL=nats:4222
    depends_on:
      - nats

volumes:
  nats_data: